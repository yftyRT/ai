[supervisord]
nodaemon=true
logfile=/workspace/factory/supervisord.log
pidfile=/tmp/supervisord.pid

[program:vllm]
command=/app/scripts/start_vllm.sh
autorestart=true
startretries=5
stopwaitsecs=60
stdout_logfile=/workspace/factory/vllm.log
redirect_stderr=true
priority=10

[program:factory]
command=python -m app.main
directory=/app
autorestart=true
startretries=20
stdout_logfile=/workspace/factory/factory.log
redirect_stderr=true
priority=20
